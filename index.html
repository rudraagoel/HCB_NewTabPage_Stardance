<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab Layout - Rudra Goel</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    
</head>

<body class="background-body">
    <main>
        
        <div class="clock-widget">
             <div class="time-display" id="digital-time">00:00:00 PM</div>
            
        </div>


        <div id="search-bar-parent-div">
           

            <div class="searchbar-center-div">
                
                <form>
                    <div class="search">
                        <span class="search-icon material-symbols-outlined">
                            search
                        </span>

                        <input class="search-input" type="search" placeholder="Search Google">

                    </div>
                </form>   
            </div>
        </div>


        <div class="shortcuts">
           <h3>Shortcuts</h3>
            <div class="shortcuts-header">
                <button id="add-shortcut">
                    +
                </button>


            </div>    

            <div class="shortcut-list", id="shortcut-list">

            </div>

        </div>


        <div class="todo">
            <form id="todo-form" class="todo-form">

        <input
            type="text"
            id="todo-input"
            placeholder="What needs to be done?"
            autocomplete="off"
        >

        <button type="submit">
            Add
        </button>

        </form>

        <div
            class="todo-list"
            id="todo-list"
        ></div>

    </div>
        </div>

        
        <div class="calendar-widget"> 
            <div class="calendar-card calendar-flipped" id="calendar-card">

                <div class="calendar-front">
                    <div class="calendar-content">

                        <div class="calendar-month">
                            <table>
                                <tr class="calendar-weekdays">
                                    <th>M</th>
                                    <th>T</th>
                                    <th>W</th>
                                    <th>T</th>
                                    <th>F</th>
                                    <th>S</th>
                                    <th>S</th>
                                </tr>

                                <tbody id="calendar-days"></tbody>
                            </table>
                        </div>

                        <div class="calendar-date">
                            <div class="calendar-date-content">
                                <div id="calendar-date">01</div>
                                <div id="calendar-day">Monday</div>
                                <div id="calendar-month-year">September/2026</div>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="calendar-back">
                    <div class="calendar-back-content">

                        <a
                            href="#"
                            id="news-link"
                            class="news-banner"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            <img
                                id="news-image"
                                src=""
                                alt="News"
                            >

                            <div class="news-info">

                                <div class="news-category" id="news-category">
                                    NEWS
                                </div>

                                <div class="news-title" id="news-title">
                                    Loading latest story...
                                </div>

                                <div class="news-meta" id="news-meta">
                                    Loading...
                                </div>

                            </div>
                        </a>

                        <div class="flip-hint">
                            ↻ Flip for Calendar
                        </div>

                    </div>
                </div>

            </div>
        </div>


        

       

        </div>

    </main>
    <script src="index.js"></script>
</body>
</html>>
